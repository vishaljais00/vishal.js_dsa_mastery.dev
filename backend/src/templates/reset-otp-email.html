<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Password Reset OTP Code</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 40px 20px;">
  <div style="max-width: 500px; margin: 0 auto; background-color: #1e293b; border-radius: 20px; border: 1px solid #334155; padding: 32px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);">
    
    <div style="text-align: center; margin-bottom: 20px;">
      <div style="width: 50px; height: 50px; background-color: #f43f5e; color: white; border-radius: 14px; display: inline-flex; align-items: center; justify-content: center; font-size: 22px; font-weight: bold; margin-bottom: 12px;">
        🔑
      </div>
      <h1 style="color: #ffffff; font-size: 22px; font-weight: 800; margin: 0;">Password Reset Request</h1>
      <p style="color: #94a3b8; font-size: 13px; margin-top: 6px;">Hello {{username}}, here is your single-use verification code.</p>
    </div>

    <div style="background-color: #0f172a; border-radius: 14px; border: 1px solid #334155; padding: 24px; text-align: center; margin-bottom: 20px;">
      <span style="font-size: 12px; color: #94a3b8; text-transform: uppercase; letter-spacing: 2px; font-weight: bold; display: block; margin-bottom: 8px;">Your 6-Digit OTP Code</span>
      <span style="font-size: 32px; font-weight: 900; letter-spacing: 8px; color: #38bdf8; font-family: monospace;">{{otpCode}}</span>
      <p style="font-size: 11px; color: #f43f5e; margin-top: 12px; margin-bottom: 0;">⏰ This code will expire in <strong>15 minutes</strong>.</p>
    </div>

    <p style="font-size: 12px; color: #64748b; text-align: center; line-height: 1.5;">
      If you did not request a password reset, please ignore this email. Your password will remain unchanged.
    </p>

  </div>
</body>
</html>
